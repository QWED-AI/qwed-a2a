[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwed-a2a"
version = "0.1.0"
description = "QWED Protocol Interceptor for Agent-to-Agent Verification"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Rahul Dass", email = "rahul@qwedai.com"}
]
keywords = ["a2a", "verification", "middleware", "llm", "qwed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "cryptography>=41.0.0,<50.0.0",
    "PyJWT>=2.13.0,<3.0.0",
    "sentry-sdk>=2.13.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "pytest-codspeed>=3.0.0,<6.0.0",
    "httpx>=0.24.0,<1.0.0",
    "black>=23.0.0,<27.0.0",
    "ruff>=0.1.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/QWED-AI/qwed-a2a"
Repository = "https://github.com/QWED-AI/qwed-a2a"

[tool.setuptools.packages.find]
where = ["src"]
