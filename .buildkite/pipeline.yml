steps:
  - label: "Run Tests"
    command:
      # The agent's system Python is externally managed (PEP 668), so pip
      # refuses to install into it. Install and test inside a venv instead.
      - python3 -m venv .venv
      - .venv/bin/python -m pip install --upgrade pip
      - .venv/bin/python -m pip install -e ".[dev]" pytest-timeout
      - .venv/bin/python -m pytest tests/ -x --timeout=30 -q -p no:cacheprovider
    timeout_in_minutes: 10
