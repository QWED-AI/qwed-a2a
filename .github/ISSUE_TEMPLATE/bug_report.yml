name: Bug Report
description: Report a bug in QWED A2A
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below.

  - type: input
    id: version
    attributes:
      label: QWED A2A Version
      description: Run `pip show qwed-a2a` to get this
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      description: Run `python --version`
      placeholder: "3.11.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Docker
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Which component is affected?
      options:
        - Interceptor Pipeline
        - Finance Guard
        - Logic Guard
        - Code Guard
        - Trust Boundary
        - Crypto / Attestations
        - FastAPI Gateway
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input that caused the bug
      description: Share a minimal, redacted reproduction. Do not include secrets, tokens, credentials, or personal data; report security issues via SECURITY.md.
      placeholder: |
        AgentMessage(
            sender_agent_id="agent-A",
            receiver_agent_id="agent-B",
            payload_type=PayloadType.FINANCIAL_TRANSACTION,
            payload={...},
        )
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include a redacted traceback if applicable; remove secrets and personal data.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information that might help
