name: Feature Request
description: Suggest a new feature for QWED A2A
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before You Submit
        
        QWED A2A is a **zero-trust verification interceptor** — features must align with fail-closed, deterministic enforcement.

  - type: dropdown
    id: component
    attributes:
      label: Which component does this affect?
      options:
        - Interceptor Pipeline
        - Finance Guard
        - Logic Guard
        - Code Guard
        - Trust Boundary
        - Crypto / Attestations
        - FastAPI Gateway
        - Documentation
        - New Engine
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
      placeholder: "Currently, QWED A2A cannot..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: This aligns with fail-closed, deterministic verification
          required: true
        - label: I have checked existing issues for duplicates
          required: true
