name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload Test Results to Mergify CI Insights
        uses: Mergifyio/gha-mergify-ci@v6
        if: ${{ always() && env.MERGIFY_TOKEN != '' }}
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: test-results.xml

      - name: SonarCloud Scan
        if: matrix.python-version == '3.11'
        uses: SonarSource/sonarcloud-github-action@v4.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run Snyk to check for vulnerabilities
        if: matrix.python-version == '3.11'
        uses: snyk/actions/python@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install black ruff

      - name: Check formatting with Black
        run: |
          black --check src/ || echo "Formatting check failed (non-blocking)"

      - name: Lint with Ruff
        run: |
          ruff check src/ || echo "Lint check failed (non-blocking)"
