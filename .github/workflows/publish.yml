name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
      version:
        description: 'Version to publish (e.g. 0.2.0). Leave empty to use pyproject.toml version.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools-scm
      - name: Derive version from git tag or manual input
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
        env:
          TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$MANUAL_VERSION" ]; then
            export VERSION="$MANUAL_VERSION"
          else
            export VERSION="${TAG#v}"
          fi
          echo "Building version: $VERSION"
          python3 -c "
import os, re
version = os.environ['VERSION']
for path in ['pyproject.toml', 'src/qwed_a2a/__init__.py']:
    with open(path) as f:
        content = f.read()
    content = re.sub(r'__version__\s*=\s*\"[^\"]*\"', f'__version__ = \"{version}\"', content)
    content = re.sub(r'^version = \".*\"', f'version = \"{version}\"', content, count=1, flags=re.MULTILINE)
    with open(path, 'w') as f:
        f.write(content)
print('Updated version in pyproject.toml and __init__.py')
"
      - name: Build package
        run: python -m build
      - name: Check package
        run: twine check dist/*
      - name: Run tests
        run: |
          python -m pip install ".[dev]"
          python -m pytest tests/ -x -q -p no:cacheprovider
      - name: Upload artifacts
        uses: actions/upload-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2a # v4.1.7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2a # v4.1.7
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # v1.12.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2a # v4.1.7
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # v1.12.3
