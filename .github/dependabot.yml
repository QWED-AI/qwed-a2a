version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # pydantic-core is an exact-pinned transitive dep of pydantic
      # (pydantic declares pydantic-core==X.Y.Z); bumping it alone
      # produces an unresolvable pip conflict (#52)
      - dependency-name: "pydantic-core"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
