version: 2.1

jobs:
  build-and-test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"
      - run:
          name: Run tests
          command: |
            pip install pytest-timeout
            pytest tests/ -v --timeout=30 --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

workflows:
  test:
    jobs:
      - build-and-test:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12"]
